  ============================================================
  TESCOMA · PÁGINA DE EXPECTATIVA (medición de interés)
  ============================================================
  Anuncia el lanzamiento y registra quién muestra interés.
  Nadie sale de la página: el botón se convierte en un mensaje
  de confirmación en el sitio.

  KLAVIYO: instalado más abajo con la clave pública UHx9TN.
  Klaviyo añade un parámetro _kx a los enlaces de sus correos y
  su script lo lee para identificar el perfil, así que el evento
  queda asociado a la persona sin pedirle el email ni ponerlo
  en la URL.

  El enlace del boletín solo necesita los UTM:
    https://TU-DOMINIO/interes.html?utm_source=klaviyo
      &utm_medium=email&utm_campaign=teaser_lanzamiento

  DESPUÉS: crea un segmento con quien haya hecho el evento
  "Interesado en ofertas exclusivas" y úsalo como lista de aviso.

  ── SOBRE EL DISEÑO ────────────────────────────────────────
  Paleta tomada de la colaboración Agatha Ruiz de la Prada que
  ya vendéis: amarillo de fondo, rojo Tescoma en la acción y
  rayas multicolor como firma. Tipografías: Fredoka (titular),
  Caveat (apunte a mano), Roboto (resto, la del tema).
  ============================================================

<style>
/* ── TOKENS ───────────────────────────────────────────────── */
:root{
  /* Marca */
  --rojo:#cc0000;            /* botones del tema */
  --rojo-hondo:#8f0000;      /* sombra sólida del botón */
  --tinta:#2c2d2c;           /* texto del tema */
  --blanco:#ffffff;

  /* Paleta Agatha, de la bolsa que aparece en la franja */
  /* Amarillo mantequilla: la alegría del amarillo sin el grito.
     Alternativas de un solo cambio, si quieres probar:
       #ffe9a3  actual, mantequilla
       #fdf0c4  más pálido, casi crema
       #ffdcc7  melocotón
       #d9ecdf  verde menta                                    */
  --amarillo:#ffe9a3;
  --magenta:#e6007e;
  --naranja:#f58220;
  --verde:#00a05a;
  --celeste:#a8dde0;

  --gris:#6f706f;
  --gris-tenue:rgba(44,45,44,.10);
  --hueso:#faf8f5;

  /* Tipografía */
  --texto:Roboto,-apple-system,"Segoe UI",sans-serif;
  --titular:Fredoka,var(--texto);
  --mano:Caveat,"Segoe Script",cursive;

  --hueco:22px;
  --hueco-desktop:5vw;
  --ancho:1500px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--texto);font-size:14px;
  color:var(--tinta);background:var(--blanco);line-height:1.55;
  min-height:100vh;display:flex;flex-direction:column;
}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}

.envoltorio{max-width:var(--ancho);margin:0 auto;padding:0 var(--hueco)}
@media (min-width:750px){ .envoltorio{padding:0 var(--hueco-desktop)} }

/* ── BARRA DE CONTACTO ───────────────────────────────────── */
.contacto{background:var(--tinta);color:#fff}
.contacto__fila{display:flex;align-items:center;gap:8px;min-height:40px;font-size:12.5px}
.contacto svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:2}
.contacto span{color:rgba(255,255,255,.65)}

/* ── CABECERA ────────────────────────────────────────────── */
.cabecera{background:var(--blanco)}
.cabecera__fila{display:flex;align-items:center;min-height:66px}
.logo{display:block;text-decoration:none;line-height:0}
.logo img{max-height:40px;width:auto;display:block}
.logo__texto{
  display:block;font-family:var(--texto);font-size:26px;font-weight:700;
  letter-spacing:-.035em;color:var(--tinta);line-height:1;
}
.logo__texto[hidden]{display:none}

/* ── CAMPO AMARILLO ──────────────────────────────────────── */
.campo{
  flex:1;background:var(--amarillo);
  display:flex;align-items:center;justify-content:center;
  padding:64px 0 70px;position:relative;overflow:hidden;
}
/* Manchas de harina apenas visibles, para que el amarillo no
   sea un plano muerto. Decoración mínima, sin imágenes. */
.campo::before,.campo::after{
  content:"";position:absolute;border-radius:50%;
  background:rgba(255,255,255,.55);pointer-events:none;
}
.campo::before{width:340px;height:340px;top:-130px;right:-90px}
.campo::after{width:220px;height:220px;bottom:-90px;left:-70px}

.bloque{
  position:relative;z-index:1;
  max-width:660px;text-align:center;padding:0 var(--hueco);
}

/* Pegatina rotada */
.pegatina{
  display:inline-block;background:var(--blanco);color:var(--rojo);
  font-family:var(--titular);font-size:12.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  padding:7px 16px;border-radius:999px;
  transform:rotate(-2.5deg);
  box-shadow:0 3px 0 rgba(0,0,0,.10);
  margin-bottom:22px;
}

/* Titular con rotulador magenta sobre las palabras del chiste */
.titular{
  font-family:var(--titular);font-weight:600;
  font-size:clamp(30px,5.6vw,50px);line-height:1.12;
  margin:0 0 18px;letter-spacing:-.01em;
  isolation:isolate;
}
.rotulador{position:relative;display:inline-block;color:var(--blanco);white-space:nowrap}
.rotulador::before{
  content:"";position:absolute;inset:2% -3% 4% -3%;z-index:-1;
  background:var(--magenta);
  border-radius:14px 18px 12px 20px;
  transform:rotate(-1.4deg);
}

.apoyo{
  font-family:var(--texto);font-size:clamp(15px,1.7vw,18px);
  color:var(--tinta);margin:0 auto 34px;max-width:460px;
}

/* ── ACCIÓN ──────────────────────────────────────────────── */
.accion{
  min-height:120px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
}
.boton{
  font-family:var(--titular);font-size:18px;font-weight:600;
  background:var(--rojo);color:var(--blanco);
  border:0;border-radius:999px;padding:16px 40px;cursor:pointer;
  box-shadow:0 5px 0 var(--rojo-hondo);
  transition:transform .12s ease,box-shadow .12s ease;
}
.boton:hover:not(:disabled){transform:translateY(2px);box-shadow:0 3px 0 var(--rojo-hondo)}
.boton:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--rojo-hondo)}
.boton:disabled{opacity:.65;cursor:wait}

/* Apunte a mano con flecha, junto al botón */
.apunte{
  font-family:var(--mano);font-size:21px;color:var(--tinta);
  transform:rotate(-3deg);display:inline-flex;align-items:center;gap:6px;
}
.apunte svg{width:26px;height:22px;stroke:var(--tinta);fill:none;stroke-width:2}

/* Confirmación */
.gracias{display:flex;flex-direction:column;align-items:center;gap:10px}
.gracias__sello{
  width:56px;height:56px;border-radius:50%;background:var(--verde);
  display:flex;align-items:center;justify-content:center;
  transform:rotate(-4deg);box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.gracias__sello svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:3}
.gracias h2{
  font-family:var(--titular);font-weight:600;font-size:26px;
  margin:0;letter-spacing:-.01em;
}
.gracias p{
  font-family:var(--mano);font-size:21px;color:var(--tinta);
  margin:0;max-width:420px;
}
.gracias__aviso{
  font-family:var(--texto);font-size:12.5px;color:var(--rojo);margin:4px 0 0;
}

/* ── FIRMA: rayas + franja de fotos ─────────────────────── */
.rayas{
  height:11px;
  background:repeating-linear-gradient(90deg,
    var(--magenta) 0 26px, var(--naranja) 26px 52px,
    var(--amarillo) 52px 78px, var(--verde) 78px 104px,
    var(--celeste) 104px 130px, var(--rojo) 130px 156px);
}
.franja{
  background:var(--blanco);overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent);
          mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent);
}
.franja__pista{display:flex;width:max-content;animation:desfila 20s linear infinite}
.franja:hover .franja__pista{animation-play-state:paused}
.franja__item{flex:0 0 auto;width:220px;height:220px;overflow:hidden}
.franja__item img{width:100%;height:100%;object-fit:cover}
@keyframes desfila{ to{ transform:translateX(-50%) } }

/* ── PIE ─────────────────────────────────────────────────── */
.pie{
  background:var(--hueso);border-top:1px solid var(--gris-tenue);
  padding:24px 0;font-size:12.5px;color:var(--gris);
}
.pie__enlaces{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:8px}
.pie__enlaces a{color:var(--gris);text-decoration:underline;text-underline-offset:.25rem}
.pie__enlaces a:hover{color:var(--rojo)}
.pie p{margin:0}

@media (max-width:768px){
  .cabecera__fila{min-height:unset;padding:8px 0}
  .logo img{max-height:26px}
  .logo__texto{font-size:21px}
  .campo{padding:44px 0 50px}
  .campo::before{width:200px;height:200px;top:-80px;right:-60px}
  .campo::after{width:140px;height:140px;bottom:-60px;left:-50px}
  .rotulador{white-space:normal}
  .boton{width:100%;padding:16px 20px;font-size:17px}
  .franja__item{width:150px;height:150px}
  .rayas{height:9px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .franja__pista{animation:none;justify-content:center;flex-wrap:wrap;width:100%}
}
</style>

/* ============================================================
   LÓGICA
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.search);
const origen = params.get("origen") || params.get("utm_source") || CONFIG.origen;
const campana = params.get("utm_campaign") || null;

document.getElementById("telefono").textContent = CONFIG.telefono;
document.getElementById("horario").textContent = " - " + CONFIG.horario;

/* Franja: la lista se duplica para que el bucle no tenga costura */
const franja = document.getElementById("franja");
const src = f => {
  if (INCRUSTADAS[f]) return INCRUSTADAS[f];
  if (f.startsWith("http") || f.startsWith("data:")) return f;
  return CONFIG.baseImagenes + f + ".jpg?width=440";
};
if (CONFIG.fotos && CONFIG.fotos.length) {
  const uno = f => `<div class="franja__item">` +
    `<img src="${src(f)}" alt="" loading="lazy" ` +
    `onerror="this.closest('.franja__item').remove()"></div>`;
  franja.innerHTML = CONFIG.fotos.map(uno).join("") +
                     CONFIG.fotos.map(uno).join("");
}

const accion = document.getElementById("accion");
const boton = document.getElementById("botonInteres");

/* Confirmación en el sitio: nadie sale de la página */
function confirmar(){
  accion.innerHTML = `
    <div class="gracias">
      <div class="gracias__sello">
        <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
      <h2>¡Apuntado!</h2>
      <p>Te avisamos en cuanto salga del horno.</p>
    </div>`;
}

boton.addEventListener("click", () => {
  boton.disabled = true;
  boton.textContent = "Un segundo...";

  /* La cola garantiza la entrega aunque el script aún no haya
     cargado. Klaviyo identifica el perfil por el parámetro _kx
     de los enlaces del boletín: no hace falta pedir el email. */
  try {
    window.klaviyo.push(["track", CONFIG.evento, {
      origen,
      campana,
      pagina: location.pathname
    }]);
  } catch (err) {
    console.error("[Tescoma] no se pudo registrar el evento:", err);
  }

  /* GA4, si está cargado, para el recuento agregado */
  if (typeof window.gtag === "function") {
    window.gtag("event", "interes_ofertas_exclusivas", { origen, campana });
  }

  /* Margen para que la petición salga antes de repintar */
  setTimeout(confirmar, 350);
});

/* Mientras klaviyo siga siendo un array, el script no ha cargado.
   Se comprueba a los 4 s: lo habitual es un bloqueador de
   anuncios o una clave pública incorrecta. */
setTimeout(() => {
  if (Array.isArray(window.klaviyo)) {
    console.warn("[Tescoma] El script de Klaviyo no ha cargado (bloqueador " +
      "o clave pública incorrecta). Los eventos quedan en cola y se " +
      "enviarán solo si el script llega a cargar en esta visita.");
  }
}, 4000);

if (!params.get("_kx")) {
  console.info("[Tescoma] Sin parámetro _kx en la URL: el evento se " +
    "registrará, pero solo se asociará a una persona si Klaviyo ya " +
    "la había identificado en este navegador. Los enlaces enviados " +
    "desde Klaviyo lo incluyen automáticamente.");
}
</script>
